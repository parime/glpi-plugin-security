# Auto-test du dépôt : chaque règle et chaque contrôle doit détecter son défaut (plugin de test
# secbad, défauts volontaires) et ne rien signaler sur la version correcte (secgood).
name: Auto-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-ref:
    name: Étiquette et version par défaut des contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Sur une étiquette vX.Y.Z, plugin-security.yml doit utiliser par défaut les scripts de cette même
      # version : sinon les plugins qui appellent @vX.Y.Z exécutent les contrôles de la version d'avant.
      - name: security-ref par défaut = étiquette publiée
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          default=$(awk '/security-ref:/{f=1} f && /default:/{print $2; exit}' .github/workflows/plugin-security.yml)
          if [ "$default" != "$TAG" ]; then
            echo "::error::security-ref vaut $default par défaut dans plugin-security.yml, l'étiquette est $TAG"
            exit 1
          fi
          echo "security-ref par défaut : $default"

  semgrep-rules:
    name: Règles Semgrep (cas de test)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - run: semgrep --validate --config semgrep/ --metrics=off
      - run: semgrep --test semgrep/ --metrics=off

  runtime-checks:
    name: Contrôles d'exécution (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - run: bash checks/start-glpi.sh
      - name: secbad doit échouer aux cinq contrôles
        run: |
          out=$(bash checks/check-plugin.sh tests/fixtures/secbad secbad || true)
          echo "$out"
          grep -q "RESULT tabs=1 rights=1 notifications=1 leftovers=1 menus=1" <<< "$out" \
            || { echo "::error::un contrôle ne détecte plus le défaut volontaire de secbad"; exit 1; }
          grep -q "MENUS 3 entrée(s) de menu" <<< "$out" \
            || { echo "::error::le contrôle des menus ne compte plus les trois entrées de secbad"; exit 1; }
          grep -q "::error::menus" <<< "$out" \
            || { echo "::error::le contrôle des menus ne bloque plus pour secbad"; exit 1; }
      - name: secgood doit passer
        run: |
          out=$(bash checks/check-plugin.sh tests/fixtures/secgood secgood) || { echo "$out"; exit 1; }
          echo "$out"
          grep -q "MENUS 1 entrée(s) de menu" <<< "$out" \
            || { echo "::error::le contrôle des menus ne compte plus l'entrée de secgood"; exit 1; }
          if grep -q "::error::menus" <<< "$out"; then
            echo "::error::le contrôle des menus bloque pour une seule entrée"; exit 1
          fi

  upgrade:
    name: Test de mise à jour (secup défectueux échoue, correct passe, ${{ matrix.glpi-image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        glpi-image: ["glpi/glpi:11.0.11", "glpi/glpi:12.0.1"]
    env:
      F: tests/fixtures/upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: Démarre GLPI
        env:
          IMAGE: ${{ matrix.glpi-image }}
        run: bash checks/start-glpi.sh "$IMAGE"
      # 1.0.0 (old) mise à jour en 1.1.0 défectueuse (bad) : migration qui oublie une colonne et un
      # index, table reconstruite (données perdues), tâche, notification et droits retirés,
      # avertissement PHP ; la page principale n'est plus servie.
      - name: version défectueuse, doit échouer à chaque contrôle
        run: |
          out=$(bash checks/check-upgrade.sh "$F/bad" secup "$F/old" "$F/old" || true)
          echo "$out"
          grep -q "RESULT errors=1 schema=1 data=1 objects=1 pages=1" <<< "$out"             || { echo "::error::un contrôle de mise à jour ne détecte plus le défaut de la version défectueuse"; exit 1; }
          for id in "upgrade-schema glpi_plugin_secup_things : .*colonne \`comment\` absente"                     "upgrade-data glpi_plugin_secup_logs" "upgrade-crontask PluginSecupThing::cleanup"                     "upgrade-notification PluginSecupThing::new" "upgrade-right plugin_secup"                     "page /plugins/secup/front/thing.php" "php-errors.log"; do
            grep -q "::error::$id" <<< "$out" || { echo "::error::défaut non signalé : $id"; exit 1; }
          done
      - name: version correcte, doit passer (ordre des colonnes et AUTO_INCREMENT ignorés)
        run: |
          out=$(bash checks/check-upgrade.sh "$F/good" secup "$F/old" "$F/old") || { echo "$out"; exit 1; }
          echo "$out"
          grep -q "6 ligne(s) du plugin avant mise à jour" <<< "$out"             || { echo "::error::le jeu de données de la version publiée n'a pas été créé"; exit 1; }
      - name: sans version publiée, avertissement sans échec
        run: |
          out=$(bash checks/check-upgrade.sh "$F/good" secup "" "") || { echo "$out"; exit 1; }
          echo "$out"
          grep -q "::warning::aucune version publiée" <<< "$out"             || { echo "::error::l'absence de version publiée doit être signalée"; exit 1; }
      - name: Journal GLPI (en cas d'échec)
        if: failure()
        run: docker logs glpisec --tail 200

  translations:
    name: Contrôle des traductions (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: secbad doit échouer
        run: |
          if php checks/check-translations.php tests/fixtures/secbad/locales; then
            echo "::error::le contrôle des traductions ne détecte plus les injections de secbad"
            exit 1
          fi
      - name: secgood doit passer
        run: php checks/check-translations.php tests/fixtures/secgood/locales

  typography:
    name: Contrôle des tirets cadratins (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: secbad doit échouer
        run: |
          if bash checks/check-em-dash.sh tests/fixtures/secbad; then
            echo "::error::le contrôle ne détecte plus le tiret cadratin de secbad"
            exit 1
          fi
      - name: secgood doit passer
        run: bash checks/check-em-dash.sh tests/fixtures/secgood

  colors:
    name: Contrôle des classes de couleur des badges (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      # secbad : bg-orange-subtle et text-orange-emphasis écrites, purple dans une classe Twig
      # construite, pink fournie par le PHP ; secgood : feuille CSS du plugin et table de couleurs.
      - name: secbad doit échouer sur les quatre défauts
        run: |
          out=$(php checks/check-subtle-colors.php tests/fixtures/secbad)             && { echo "$out"; echo "::error::le contrôle ne détecte plus les classes non définies de secbad"; exit 1; }
          echo "$out"
          for expected in "file=templates/badges.html.twig,line=2::la classe bg-orange-subtle"                           "file=templates/badges.html.twig,line=2::la classe text-orange-emphasis"                           "file=templates/badges.html.twig,line=3::la couleur « purple »"                           "file=inc/badge.php,line=6::la couleur « pink »"; do
            grep -qF "$expected" <<< "$out" || { echo "::error::défaut non signalé : $expected"; exit 1; }
          done
          [ "$(grep -c '^::error' <<< "$out")" = 4 ] || { echo "::error::nombre d'écarts de secbad inattendu"; exit 1; }
      - name: secgood doit passer
        run: php checks/check-subtle-colors.php tests/fixtures/secgood

  navigation:
    name: Contrôle d'ergonomie (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      # secbad : deux entrées dans Outils, une dans Configuration, page de configuration rangée dans
      # Assistance, page sans en-tête, bouton « Récupérer maintenant », tableau de résultats et lien
      # vers une page d'usage dans la configuration ; secgood : la version correcte.
      - name: secbad doit échouer sur les sept écarts
        run: |
          out=$(php checks/check-navigation.php tests/fixtures/secbad) \
            && { echo "$out"; echo "::error::le contrôle d'ergonomie ne détecte plus les écarts de secbad"; exit 1; }
          echo "$out"
          for expected in "[menus-secteur tools]" "[menus-entree-native config > PluginSecbadThing]" \
                          "[entete-secteur front/config.php]" "[page-entete front/report.php]" \
                          "[config-action templates/config.html.twig]" "[config-tableau templates/config.html.twig]" \
                          "[config-lien templates/config.html.twig > front/report.php]"; do
            grep -qF "$expected" <<< "$out" || { echo "::error::écart non signalé : $expected"; exit 1; }
          done
          [ "$(grep -c '^::error' <<< "$out")" = 7 ] || { echo "::error::nombre d'écarts de secbad inattendu"; exit 1; }
      - name: secbad n'échoue pas en mode avertissement, mais avertit
        run: |
          out=$(php checks/check-navigation.php tests/fixtures/secbad warning) \
            || { echo "$out"; echo "::error::le mode avertissement ne doit pas échouer"; exit 1; }
          echo "$out"
          [ "$(grep -c '^::warning' <<< "$out")" = 7 ] || { echo "::error::le mode avertissement n'annote plus les écarts"; exit 1; }
      - name: secbad passe quand chaque écart est une exception justifiée
        run: |
          d=$(mktemp -d); cp -r tests/fixtures/secbad/. "$d"
          php checks/check-navigation.php "$d" | sed -n 's/^::error.*\[\(.*\)\]$/\1 : exception de test/p' > "$d/.glpi-security-exceptions"
          cat "$d/.glpi-security-exceptions"
          php checks/check-navigation.php "$d"
      - name: secgood doit passer
        run: php checks/check-navigation.php tests/fixtures/secgood

  archive:
    name: Contrôle de l'archive (sans export-ignore échoue, avec passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      # Le faux plugin devient un dépôt à part : git archive ne lit que ses fichiers commités.
      - name: sans export-ignore, doit échouer
        run: |
          d=$(mktemp -d); cp -r tests/fixtures/archive/. "$d"; rm "$d/gitattributes-clean"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.name=ci -c user.email=ci@example.org commit -qm fixture
          if bash checks/check-archive.sh "$d"; then
            echo "::error::le contrôle de l'archive ne détecte plus tests/ et phpstan.neon"
            exit 1
          fi
      - name: avec export-ignore, doit passer
        run: |
          d=$(mktemp -d); cp -r tests/fixtures/archive/. "$d"; mv "$d/gitattributes-clean" "$d/.gitattributes"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.name=ci -c user.email=ci@example.org commit -qm fixture
          bash checks/check-archive.sh "$d"

  workflows:
    name: Contrôle des workflows (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: secbad doit échouer
        run: |
          if bash checks/check-workflows.sh tests/fixtures/secbad; then
            echo "::error::le contrôle ne détecte plus le workflow invalide de secbad"
            exit 1
          fi
      - name: secgood doit passer
        run: bash checks/check-workflows.sh tests/fixtures/secgood
      - name: les workflows de ce dépôt doivent passer
        run: bash checks/check-workflows.sh .

  charter:
    name: Contrôle de la charte commune (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: secbad doit échouer en mode bloquant
        run: |
          if bash checks/check-charter.sh tests/fixtures/secbad error; then
            echo "::error::le contrôle de la charte ne détecte plus les écarts de secbad"
            exit 1
          fi
      - name: secbad n'échoue pas en mode avertissement, mais avertit
        run: |
          out=$(bash checks/check-charter.sh tests/fixtures/secbad warning) \
            || { echo "$out"; echo "::error::le mode avertissement ne doit pas échouer"; exit 1; }
          grep -q "::warning::fichier NOTICE absent" <<< "$out" \
            || { echo "::error::le mode avertissement n'annote plus les écarts"; exit 1; }
      - name: secgood doit passer en mode bloquant
        run: bash checks/check-charter.sh tests/fixtures/secgood error

  entrypoints:
    name: Points d'entrée, matrice d'accès et exigences marketplace (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: secbad doit échouer aux trois contrôles
        run: |
          for check in "sh checks/check-entrypoints-auth.sh" "sh checks/check-security-matrix-coverage.sh" \
                       "php checks/check-marketplace-readiness.php"; do
            if $check tests/fixtures/secbad; then
              echo "::error::$check ne détecte plus le défaut volontaire de secbad"
              exit 1
            fi
          done
      - name: secgood doit passer
        run: |
          sh checks/check-entrypoints-auth.sh tests/fixtures/secgood
          sh checks/check-security-matrix-coverage.sh tests/fixtures/secgood
          php checks/check-marketplace-readiness.php tests/fixtures/secgood
      - name: sans matrice d'accès, avertissement sans échec
        run: |
          d=$(mktemp -d); mkdir "$d/front"; cp tests/fixtures/secgood/front/thing.php "$d/front/"
          out=$(sh checks/check-security-matrix-coverage.sh "$d") \
            || { echo "$out"; echo "::error::une matrice absente ne doit pas faire échouer"; exit 1; }
          grep -q "::warning::" <<< "$out" || { echo "::error::une matrice absente doit être signalée"; exit 1; }

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - run: shellcheck checks/*.sh

  analyses:
    name: Gitleaks, Trivy et langages CodeQL (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: exception sans raison refusée
        run: |
          printf 'gitleaks a.php:generic-api-key:1\n' > "$RUNNER_TEMP/sans-raison"
          if bash checks/security-exceptions.sh "$RUNNER_TEMP/sans-raison" gitleaks; then
            echo "::error::une exception sans raison doit être refusée"; exit 1
          fi
      - name: Gitleaks, secbad doit échouer
        run: |
          if bash checks/check-secrets.sh tests/fixtures/secbad; then
            echo "::error::Gitleaks ne trouve plus la clé de secbad/config/secbad.ini"; exit 1
          fi
      - name: Gitleaks, secbad passe avec l'exception justifiée
        run: |
          printf 'gitleaks config/secbad.ini:generic-api-key:4 : clé factice de la fixture\n' > "$RUNNER_TEMP/exceptions"
          bash checks/check-secrets.sh tests/fixtures/secbad "$RUNNER_TEMP/exceptions"
      - name: Gitleaks, secgood doit passer
        run: bash checks/check-secrets.sh tests/fixtures/secgood
      - name: Trivy, secbad doit échouer
        run: |
          d=$(mktemp -d); cp -r tests/fixtures/secbad/. "$d"
          cp "$d/deps/composer.lock.fixture" "$d/deps/composer.lock"
          cp "$d/deps/package-lock.json.fixture" "$d/deps/package-lock.json"
          out=$(bash checks/check-dependencies.sh "$d" 2>&1) && {
            echo "$out"; echo "::error::Trivy ne trouve plus les dépendances vulnérables de secbad"; exit 1; }
          echo "$out"
          for lib in guzzlehttp/guzzle lodash; do
            grep -q "$lib" <<< "$out" || { echo "::error::Trivy ne signale plus $lib"; exit 1; }
          done
      - name: Trivy, secgood doit passer
        run: bash checks/check-dependencies.sh tests/fixtures/secgood
      - name: langages CodeQL détectés
        run: |
          for f in secbad secgood; do
            got=$(bash checks/codeql-languages.sh "tests/fixtures/$f")
            [ "$got" = '["actions","javascript"]' ] || { echo "::error::$f : langages $got"; exit 1; }
          done
          d=$(mktemp -d); git -C "$d" init -q; touch "$d/a.php"; git -C "$d" add -A
          got=$(bash checks/codeql-languages.sh "$d")
          [ "$got" = '[]' ] || { echo "::error::plugin PHP seul : langages $got"; exit 1; }

  codeql:
    name: CodeQL (${{ matrix.fixture }} ${{ matrix.expect }})
    runs-on: ubuntu-latest
    # Sur une pull_request, CodeQL ne garde par défaut que les résultats des lignes modifiées
    # (analyse limitée au diff) : la XSS volontaire de secbad disparaît dès qu'une PR ne touche pas
    # public/js/thing.js. L'auto-test analyse toujours la fixture entière.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: secbad
            languages: javascript
            expect: échoue
          - fixture: secgood
            languages: actions,javascript
            expect: passe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 (SHA pinned)
        with:
          languages: ${{ matrix.languages }}
          build-mode: none
          source-root: tests/fixtures/${{ matrix.fixture }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 (SHA pinned)
        with:
          category: /fixture:${{ matrix.fixture }}
          upload: never
          output: ${{ runner.temp }}/codeql
      - name: secgood passe
        if: matrix.fixture == 'secgood'
        run: bash checks/check-codeql-sarif.sh "$RUNNER_TEMP/codeql"
      - name: secbad échoue, puis passe avec ses résultats justifiés
        if: matrix.fixture == 'secbad'
        run: |
          if bash checks/check-codeql-sarif.sh "$RUNNER_TEMP/codeql"; then
            echo "::error::CodeQL ne trouve plus la XSS de secbad/public/js/thing.js"; exit 1
          fi
          jq -r '.runs[].results[] | "codeql \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri) : test"' \
            "$RUNNER_TEMP"/codeql/*.sarif > "$RUNNER_TEMP/exceptions"
          cat "$RUNNER_TEMP/exceptions"
          grep -q "public/js/thing.js" "$RUNNER_TEMP/exceptions" \
            || { echo "::error::le résultat attendu porte sur public/js/thing.js"; exit 1; }
          bash checks/check-codeql-sarif.sh "$RUNNER_TEMP/codeql" "$RUNNER_TEMP/exceptions"

  translated-assertions:
    name: Contrôle des assertions sur un libellé traduit (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      # secbad : sprintf(__()), __() dans un « contient », msgid anglais attendu, traduction
      # française attendue dans un tableau ; secgood : clés, nombres, chaînes passées à une fonction
      # ou concaténées, et une exception justifiée.
      - name: secbad doit échouer sur les quatre défauts
        run: |
          out=$(php checks/check-translated-assertions.php tests/fixtures/secbad) \
            && { echo "$out"; echo "::error::le contrôle ne détecte plus les assertions de secbad"; exit 1; }
          echo "$out"
          for line in 9 10 11 12; do
            grep -qF "::error file=tests/Unit/LabelTest.php,line=$line::" <<< "$out" \
              || { echo "::error::assertion de la ligne $line de secbad non signalée"; exit 1; }
          done
          [ "$(grep -c '^::error' <<< "$out")" = 4 ] || { echo "::error::nombre d'écarts de secbad inattendu"; exit 1; }
      - name: secbad n'échoue pas en mode avertissement, mais avertit
        run: |
          out=$(php checks/check-translated-assertions.php tests/fixtures/secbad warning) \
            || { echo "$out"; echo "::error::le mode avertissement ne doit pas faire échouer"; exit 1; }
          [ "$(grep -c '^::warning' <<< "$out")" = 4 ] || { echo "$out"; echo "::error::avertissements attendus"; exit 1; }
      - name: secgood doit passer (une exception justifiée)
        run: |
          out=$(php checks/check-translated-assertions.php tests/fixtures/secgood) || { echo "$out"; exit 1; }
          echo "$out"
          grep -q "1 exception(s) justifiée(s)" <<< "$out" || { echo "::error::exception de secgood non lue"; exit 1; }

  integration-language:
    name: Passe des tests d'intégration en français (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - run: bash checks/start-glpi.sh
      # La sonde de secgood vérifie la langue de la session, de l'instance et de l'utilisateur glpi,
      # et que __() traduit ; le test de secbad attend le libellé anglais.
      - name: secgood passe en fr_FR et en en_GB (langue réglée partout)
        run: |
          bash checks/run-integration-tests.sh tests/fixtures/secgood secgood fr_FR "php tests/language-probe.php"
          bash checks/run-integration-tests.sh tests/fixtures/secgood secgood en_GB "php tests/language-probe.php"
      - name: le test dépendant de la langue de secbad passe en en_GB et échoue en fr_FR
        run: |
          bash checks/run-integration-tests.sh tests/fixtures/secbad secbad en_GB "php tests/language-dependent.php" \
            || { echo "::error::le test de secbad doit passer en anglais"; exit 1; }
          if bash checks/run-integration-tests.sh tests/fixtures/secbad secbad fr_FR "php tests/language-dependent.php"; then
            echo "::error::la passe en français ne détecte plus le test dépendant de la langue de secbad"; exit 1
          fi
      - name: sans suite d'intégration, avertissement sans échec
        run: |
          out=$(bash checks/run-integration-tests.sh tests/fixtures/secgood secgood fr_FR) || { echo "$out"; exit 1; }
          grep -q "::warning::aucune suite d'intégration" <<< "$out" || { echo "$out"; echo "::error::avertissement attendu"; exit 1; }
      - name: Journal GLPI (en cas d'échec)
        if: failure()
        run: docker logs glpisec --tail 200

  pages:
    name: Parcours des pages (${{ matrix.image }}, secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["glpi/glpi:11.0.11", "glpi/glpi:12.0.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - env:
          IMAGE: ${{ matrix.image }}
        run: bash checks/start-glpi.sh "$IMAGE"
      # secbad : page en 500 (crash.php), écran hors menu avec une image sans texte de remplacement
      # (hidden.php), page de configuration rangée dans Assistance (fil d'Ariane faux).
      - name: secbad doit échouer sur chaque défaut
        run: |
          out=$(bash checks/check-pages.sh tests/fixtures/secbad secbad) && { echo "$out"; echo "::error::le parcours ne bloque plus secbad"; exit 1; }
          echo "$out"
          for id in "crawl http-500 front/crash.php" "crawl orphan front/hidden.php" "crawl ariane front/config.php"                     "crawl axe:image-alt front/hidden.php" "crawl php-errors"; do
            grep -q "^::error::$id" <<< "$out" || { echo "::error::défaut non signalé : $id"; exit 1; }
          done
      - name: secbad n'échoue pas en mode avertissement, mais avertit
        run: |
          out=$(bash checks/check-pages.sh tests/fixtures/secbad secbad "" "" warning) || { echo "$out"; echo "::error::le mode avertissement bloque"; exit 1; }
          grep -q "^::warning::crawl orphan front/hidden.php" <<< "$out" || { echo "$out"; echo "::error::le mode avertissement n'annote plus"; exit 1; }
      - name: secgood doit passer
        run: |
          out=$(bash checks/check-pages.sh tests/fixtures/secgood secgood .glpi-security-exceptions) || { echo "$out"; exit 1; }
          echo "$out"
