# Auto-test du dépôt : chaque règle et chaque contrôle doit détecter son défaut (plugin de test
# secbad, défauts volontaires) et ne rien signaler sur la version correcte (secgood).
name: Auto-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  semgrep-rules:
    name: Règles Semgrep (cas de test)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - run: semgrep --validate --config semgrep/ --metrics=off
      - run: semgrep --test semgrep/ --metrics=off

  runtime-checks:
    name: Contrôles d'exécution (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - run: bash checks/start-glpi.sh
      - name: secbad doit échouer aux quatre contrôles
        run: |
          out=$(bash checks/check-plugin.sh tests/fixtures/secbad secbad || true)
          echo "$out"
          grep -q "RESULT tabs=1 rights=1 notifications=1 leftovers=1" <<< "$out" \
            || { echo "::error::un contrôle ne détecte plus le défaut volontaire de secbad"; exit 1; }
      - name: secgood doit passer
        run: bash checks/check-plugin.sh tests/fixtures/secgood secgood

  translations:
    name: Contrôle des traductions (secbad échoue, secgood passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - name: secbad doit échouer
        run: |
          if php checks/check-translations.php tests/fixtures/secbad/locales; then
            echo "::error::le contrôle des traductions ne détecte plus les injections de secbad"
            exit 1
          fi
      - name: secgood doit passer
        run: php checks/check-translations.php tests/fixtures/secgood/locales

  archive:
    name: Contrôle de l'archive (sans export-ignore échoue, avec passe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      # Le faux plugin devient un dépôt à part : git archive ne lit que ses fichiers commités.
      - name: sans export-ignore, doit échouer
        run: |
          d=$(mktemp -d); cp -r tests/fixtures/archive/. "$d"; rm "$d/gitattributes-clean"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.name=ci -c user.email=ci@example.org commit -qm fixture
          if bash checks/check-archive.sh "$d"; then
            echo "::error::le contrôle de l'archive ne détecte plus tests/ et phpstan.neon"
            exit 1
          fi
      - name: avec export-ignore, doit passer
        run: |
          d=$(mktemp -d); cp -r tests/fixtures/archive/. "$d"; mv "$d/gitattributes-clean" "$d/.gitattributes"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.name=ci -c user.email=ci@example.org commit -qm fixture
          bash checks/check-archive.sh "$d"

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - run: shellcheck checks/*.sh
