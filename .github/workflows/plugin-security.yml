# Contrôles de sécurité communs à tous les plugins GLPI de parime : workflow réutilisable.
#
# Dans le dépôt d'un plugin (.github/workflows/security.yml) :
#
#   name: Sécurité
#   on: [push, pull_request]
#   jobs:
#     security:
#       uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.8.0
#       with:
#         plugin-key: monplugin            # nom du dossier du plugin dans plugins/
#         # seed-command: php plugins/monplugin/tests/security/setup.php   (facultatif)
#
# Voir README.md : ce que chaque contrôle vérifie, et le fichier d'exceptions justifiées.
name: Contrôles de sécurité des plugins GLPI

on:
  workflow_call:
    inputs:
      plugin-key:
        description: Clé du plugin (nom de son dossier dans plugins/ et suffixe de plugin_version_<clé>)
        required: true
        type: string
      glpi-image:
        description: Image GLPI des contrôles d'exécution
        required: false
        type: string
        default: glpi/glpi:11.0.11
      seed-command:
        description: Commande lancée dans le conteneur GLPI (dossier de GLPI, www-data) avant la désinstallation
        required: false
        type: string
        default: ''
      exceptions-file:
        description: Fichier d'exceptions justifiées, à la racine du dépôt du plugin
        required: false
        type: string
        default: .glpi-security-exceptions
      security-ref:
        description: Version des règles et contrôles communs (étiquette de parime/glpi-plugin-security)
        required: false
        type: string
        # À passer à la nouvelle étiquette dans le commit étiqueté (contrôlé par self-test.yml).
        default: v1.9.1
      charter-mode:
        description: "Charte commune : error (bloquant, par défaut depuis v1.9.0) ou warning (avertissements)"
        required: false
        type: string
        default: error
      access-matrix-file:
        description: "Fichier de la matrice d'accès du plugin (script de bout en bout ou test PHPUnit), relatif au dépôt"
        required: false
        type: string
        default: tests/security/access-matrix.sh
      upgrade-test:
        description: "Test de mise à jour depuis la dernière version publiée (false pour le désactiver)"
        required: false
        type: boolean
        default: true
      upgrade-glpi-images:
        description: Images GLPI du test de mise à jour (liste JSON)
        required: false
        type: string
        default: '["glpi/glpi:11.0.11", "glpi/glpi:12.0.1"]'
      upgrade-seed-command:
        description: "Jeu de données créé avec la version publiée avant la mise à jour (défaut : seed-command, sinon tests/security/setup.php de l'étiquette)"
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  semgrep:
    name: Règles Semgrep communes (GLPI)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      - name: Règles bloquantes (ERROR)
        run: >-
          semgrep scan --config .glpi-plugin-security/semgrep/glpi-plugin-security.yml
          --severity ERROR --error --metrics=off
          --exclude .glpi-plugin-security --exclude vendor --exclude node_modules
      - name: Avertissements (non bloquants)
        run: >-
          semgrep scan --config .glpi-plugin-security/semgrep/glpi-plugin-security.yml
          --severity WARNING --metrics=off
          --exclude .glpi-plugin-security --exclude vendor --exclude node_modules || true

  translations:
    name: Traductions sans contenu actif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      - name: Aucune balise, URL, JavaScript ou balise ##…## ajoutée par une traduction
        run: php .glpi-plugin-security/checks/check-translations.php locales

  typography:
    name: Aucun tiret cadratin dans les textes produits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      - name: Tiret cadratin refusé (chaînes, traductions, documentation)
        run: bash .glpi-plugin-security/checks/check-em-dash.sh .

  colors:
    name: Classes de couleur des badges définies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      # Charte section 8 (issue #20) : Tabler ne définit bg-X-subtle, text-X-emphasis et
      # border-X-subtle que pour les couleurs de thème ; une couleur nommée (orange...) doit être
      # définie par une feuille CSS du plugin, sinon le badge s'affiche sans fond.
      - name: bg-X-subtle / text-X-emphasis / border-X-subtle de thème ou définies par le plugin
        run: php .glpi-plugin-security/checks/check-subtle-colors.php .

  archive:
    name: Archive de release sans fichier de développement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      # Ce que `git archive` produit, c'est-à-dire l'archive publiée : ni tests, ni CI, ni
      # configuration d'analyse (export-ignore dans .gitattributes).
      - name: Contenu de l'archive publiée
        run: bash .glpi-plugin-security/checks/check-archive.sh .

  workflows:
    name: Workflows GitHub Actions valides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      # Un workflow invalide ne démarre plus du tout : la CI du plugin se tait au lieu d'échouer.
      - name: YAML et syntaxe des workflows (actionlint)
        run: bash .glpi-plugin-security/checks/check-workflows.sh .

  charter:
    name: Charte commune (licence, documentation, langues)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      # CHARTE.md de parime/glpi-plugin-template. Bloquant par défaut depuis v1.9.0 ; un plugin en
      # cours de mise en conformité peut repasser temporairement en charter-mode: warning.
      - name: Licence, en-têtes, documentation et langues
        env:
          MODE: ${{ inputs.charter-mode }}
        run: bash .glpi-plugin-security/checks/check-charter.sh . "$MODE"

  entrypoints:
    name: Points d'entrée, matrice d'accès et exigences marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: .glpi-plugin-security
      # Repris de .github/scripts/ des plugins (issue #11) : chaque plugin garde ses fichiers de
      # réglage (.github/security-entrypoints-allowlist.txt, tests/security/not-covered.txt,
      # .github/twig-baseline.txt, .github/marketplace-allowlist.txt).
      - name: Chaque point d'entrée (front/, ajax/) contrôle les droits
        run: sh .glpi-plugin-security/checks/check-entrypoints-auth.sh .
      - name: Chaque page figure dans la matrice d'accès (${{ inputs.access-matrix-file }})
        env:
          ACCESS_MATRIX_FILE: ${{ inputs.access-matrix-file }}
        run: sh .glpi-plugin-security/checks/check-security-matrix-coverage.sh . "$ACCESS_MATRIX_FILE"
      - name: Pas de SQL brut hors installation, pas de nouveau HTML écrit en PHP
        run: php .glpi-plugin-security/checks/check-marketplace-readiness.php .

  runtime:
    name: Contrôles dans un vrai GLPI (onglets, notifications, désinstallation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          path: plugin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: security
      - name: Démarre GLPI
        run: bash security/checks/start-glpi.sh "${{ inputs.glpi-image }}"
      - name: Contrôle le plugin
        env:
          PLUGIN_KEY: ${{ inputs.plugin-key }}
          EXCEPTIONS: ${{ inputs.exceptions-file }}
          SEED: ${{ inputs.seed-command }}
        run: bash security/checks/check-plugin.sh plugin "$PLUGIN_KEY" "$EXCEPTIONS" "$SEED"
      - name: Journal GLPI (en cas d'échec)
        if: failure()
        run: docker logs glpisec --tail 200

  upgrade:
    # Issue #24 : ce que font tous les utilisateurs, la mise à jour d'une installation existante.
    # Version publiée installée et remplie, remplacée par le code de la PR, puis comparée à une
    # installation neuve de ce code (voir README, « Mise à jour depuis la version publiée »).
    name: Mise à jour depuis la version publiée (${{ matrix.glpi-image }})
    if: inputs.upgrade-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        glpi-image: ${{ fromJSON(inputs.upgrade-glpi-images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          path: plugin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          repository: parime/glpi-plugin-security
          ref: ${{ inputs.security-ref }}
          path: security
      # Archive de la dernière release GitHub (empreinte .sha256 vérifiée) et sources de son
      # étiquette (tests/ et jeu de données, exclus de l'archive). API REST seulement.
      - name: Dernière version publiée du plugin
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PLUGIN_KEY: ${{ inputs.plugin-key }}
        run: bash security/checks/fetch-previous-release.sh "$REPO" "$PLUGIN_KEY" "$RUNNER_TEMP/previous" plugin
      - name: Démarre GLPI
        env:
          IMAGE: ${{ matrix.glpi-image }}
        run: bash security/checks/start-glpi.sh "$IMAGE"
      - name: Mise à jour vers le code de la PR et comparaison à une installation neuve
        env:
          PLUGIN_KEY: ${{ inputs.plugin-key }}
          OLD: ${{ steps.previous.outputs.old }}
          OLD_SRC: ${{ steps.previous.outputs.old-src }}
          EXCEPTIONS: ${{ inputs.exceptions-file }}
          SEED: ${{ inputs.upgrade-seed-command || inputs.seed-command }}
        run: bash security/checks/check-upgrade.sh plugin "$PLUGIN_KEY" "$OLD" "$OLD_SRC" "$EXCEPTIONS" "$SEED"
      - name: Journal GLPI (en cas d'échec)
        if: failure()
        run: docker logs glpisec --tail 200
